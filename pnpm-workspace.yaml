packages:
  - .
  - .aws
ignore-workspace-root-check: true
# pnpm 11 hard-errors on packages whose build scripts it hasn't been told to run,
# where pnpm 10 only warned. pnpm 11 reads `allowBuilds`; pnpm 10 reads the older
# `onlyBuiltDependencies`. Both are listed so a contributor still on pnpm 10 gets
# the same behaviour as CI and the Docker image, which are both on 11.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
allowBuilds:
  esbuild: true
  unrs-resolver: true
